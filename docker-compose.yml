services:
  postgres:
    image: postgres:15
    container_name: vehicle-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-VehicleServiceDb}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vehicle-network

volumes:
  postgres_data:

networks:
  vehicle-network:
    driver: bridge